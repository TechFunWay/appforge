name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
	- uses: actions/checkout@v4
	- uses: actions/setup-go@v5
		with:
			go-version: "1.26"
			cache: true
	- name: gofmt
		run: test -z "$(gofmt -l kit examples)" || (gofmt -l kit examples; exit 1)
	- name: vet
		run: go vet ./...
	- name: build
		run: go build ./...
	- name: test
		run: go test ./...
