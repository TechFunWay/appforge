name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l kit examples)" || (gofmt -l kit examples; exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: 示例应用可启动冒烟
        run: |
          go build -o /tmp/minimal ./examples/minimal
          /tmp/minimal -port 18080 -data-dir /tmp/d > /tmp/boot.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:18080/api/version
          kill %1
